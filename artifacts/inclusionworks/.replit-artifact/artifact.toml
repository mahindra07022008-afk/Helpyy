kind = "web"
previewPath = "/inclusionworks/"
title = "InclusionWorks Webinar"
description = "A responsive event landing and RSVP site for InclusionWorks’ free Building Belonging in Remote Teams masterclass. Visitors can explore event information and reserve a seat."
version = "1.0.0"
id = "artifacts/inclusionworks"
router = "path"

[[services]]
name = "web"
paths = [ "/inclusionworks/" ]
localPort = 21795

[services.development]
run = "pnpm --filter @workspace/inclusionworks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inclusionworks", "run", "build" ]
serve = "static"
publicDir = "artifacts/inclusionworks/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21795"
BASE_PATH = "/inclusionworks/"
